<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Application Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Application Ledger</h1>
      <p>Every job you're weighing: the posting, the résumé you sent, how it scored, and which Claude skills touched it.</p>
    </div>
    <div class="actions">
      <button class="btn" id="resetBtn" type="button" hidden>Reset demo data</button>
      <button class="btn primary" id="addBtn" type="button">+ Add job</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Ledger sections">
    <button class="tab" role="tab" id="tab-jobs" aria-controls="jobsView" aria-selected="true" type="button">Jobs <span class="cnt" id="cnt-jobs">0</span></button>
    <button class="tab" role="tab" id="tab-companies" aria-controls="coView" aria-selected="false" type="button">Company notes <span class="cnt" id="cnt-companies">0</span></button>
  </div>

  <div class="note" id="note" hidden></div>

  <div class="view" id="coView" role="tabpanel" aria-labelledby="tab-companies" hidden>
    <div class="bar">
      <input type="search" id="coSearch" placeholder="Search companies and notes…" aria-label="Search companies">
      <select id="coSort" aria-label="Sort companies">
        <option value="interest">Most interested</option>
        <option value="updated">Recently updated</option>
        <option value="name">Company A–Z</option>
      </select>
    </div>
    <div class="cogrid" id="coGrid"><div class="blank"><h3>Loading your companies…</h3></div></div>
  </div>

  <div class="view" id="jobsView" role="tabpanel" aria-labelledby="tab-jobs">
    <div class="strip" id="strip"></div>

    <div class="bar">
      <input type="search" id="search" placeholder="Search company, title, résumé, notes…" aria-label="Search jobs">
      <select id="sort" aria-label="Sort jobs">
        <option value="match">Best match</option>
        <option value="updated">Recently updated</option>
        <option value="posted">Newest posting</option>
        <option value="ats">Best ATS score</option>
        <option value="applied">Date applied</option>
        <option value="company">Company A–Z</option>
      </select>
    </div>

    <div class="ledger" id="ledger">
      <div class="row head" aria-hidden="true">
        <div>Role</div><div>Status</div><div>Posted</div><div>Location</div><div>Salary</div><div>Match</div><div>ATS</div><div>Résumé</div><div>Claude tools</div>
      </div>
      <div id="rows"><div class="blank"><h3>Loading your applications…</h3></div></div>
    </div>
  </div>
</div>

<div id="sheetHost"></div>
<div id="viewerHost"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<!-- Storage adapter: localStorage-backed stand-in for the claude.ai runtime (db, assets, user). -->
<script src="demo.js"></script>
<script src="app.js"></script>
</body>
</html>
